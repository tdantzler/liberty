<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liberty — Control</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B1528;--lift:#101E36;--cyan:#06F7D4;--text:#EAF2F5;--mute:#7E8FA6;--line:#1E3050;--warn:#FF6B4A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--text);font-family:'Geist',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;padding:26px 20px 60px;display:flex;justify-content:center}
.wrap{width:100%;max-width:520px}
h1{font-size:24px;font-weight:600;letter-spacing:-.025em;margin-bottom:6px}
.sub{color:var(--mute);font-size:13px;line-height:1.6;margin-bottom:24px}
.kicker{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin-bottom:10px}

.statrow{display:flex;gap:12px;margin-bottom:20px}
.stat{flex:1;background:var(--lift);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.stat .n{font-family:'Geist Mono',monospace;font-size:30px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.stat .l{font-family:'Geist Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:9px}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cyan);margin-right:7px;animation:beat 1.9s ease-in-out infinite;vertical-align:middle}
.pulse.cold{background:#5A3A3A;animation:none}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.22}}

.btnrow{display:flex;gap:10px;margin-bottom:22px}
button{flex:1;border:0;border-radius:8px;font-family:'Geist',sans-serif;font-weight:600;font-size:14px;
  padding:15px;cursor:pointer;transition:filter .16s,transform .1s}
button:active{transform:translateY(1px)}
.clear{background:var(--warn);color:#1A0600}
.refresh{background:var(--lift);color:var(--text);border:1px solid var(--line)}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.msg{font-family:'Geist Mono',monospace;font-size:11px;line-height:1.7;padding:12px 14px;border-radius:8px;margin-bottom:20px;display:none}
.msg.ok{display:block;background:rgba(6,247,212,.09);color:var(--cyan);border:1px solid rgba(6,247,212,.28)}
.msg.bad{display:block;background:rgba(255,107,74,.09);color:var(--warn);border:1px solid rgba(255,107,74,.3)}

.tally{background:var(--lift);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:20px;display:none}
.tally.on{display:block}
.tal{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:12px}
.tal:first-of-type{margin-top:0}
.tal .lbl{flex:0 0 auto;width:52%;color:var(--mute);line-height:1.3}
.tal .track{flex:1;height:6px;background:var(--ink);border-radius:3px;overflow:hidden}
.tal .fill{height:100%;background:var(--cyan);border-radius:3px;min-width:3px}
.tal .ct{font-family:'Geist Mono',monospace;font-size:11px;width:20px;text-align:right}

#list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--lift);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.row .nm{font-size:15px;font-weight:600;letter-spacing:-.015em}
.row .bz{font-family:'Geist Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);margin-top:3px}
.row .pn{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.4}
.empty{color:var(--mute);font-size:13px;font-family:'Geist Mono',monospace;padding:22px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">

  <p class="kicker">SysSential — operator only</p>
  <h1>Liberty control</h1>
  <p class="sub">Live roster from the demo workflow. Keep this on your own phone — do not put it on the TV or hand it to anyone.</p>

  <div class="statrow">
    <div class="stat"><div class="n" id="count">—</div><div class="l"><span class="pulse" id="pulse"></span>Submissions</div></div>
    <div class="stat"><div class="n" id="last">—</div><div class="l">Newest</div></div>
  </div>

  <div class="btnrow">
    <button class="refresh" id="refresh">Refresh now</button>
    <button class="clear" id="clear">Clear the board</button>
  </div>

  <div class="msg" id="msg"></div>

  <div class="tally" id="tally">
    <div class="kicker" style="margin-bottom:12px">What the room picked</div>
    <div id="tallyrows"></div>
  </div>

  <div id="list"></div>

</div>

<script>
/* ============ CONFIG ============ */
const N8N_BASE   = "https://n8n.srv1047408.hstgr.cloud";
const BOARD_PATH = "/webhook/soar-board";
const RESET_KEY  = "SOAR2026";
const POLL_MS    = 4000;
/* ================================ */

const $ = id => document.getElementById(id);
let prevCount = 0;

function esc(s){ return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function note(text, ok){ const m=$('msg'); m.textContent=text; m.className='msg '+(ok?'ok':'bad'); }

async function load(reset){
  try{
    const url = N8N_BASE + BOARD_PATH + '?t=' + Date.now() + (reset ? '&reset=' + RESET_KEY : '');
    const res = await fetch(url, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const list = Array.isArray(data) ? data : (data.roster || []);
    render(list);
    $('pulse').classList.remove('cold');
    if (reset) note('Board cleared — ' + new Date().toLocaleTimeString() + '. Phones catch up within a few seconds.', true);
    return list;
  }catch(e){
    $('pulse').classList.add('cold');
    note('Could not reach the workflow: ' + e.message + '. Check it is published.', false);
    return null;
  }
}

function render(list){
  $('count').textContent = list.length;
  const newest = list.length ? list[list.length-1] : null;
  $('last').textContent = newest ? esc(newest.first) : '—';

  // tally of the pain dropdown
  const counts = {};
  list.forEach(r => { if(r.pain) counts[r.pain] = (counts[r.pain]||0) + 1; });
  const pairs = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if (pairs.length){
    $('tally').classList.add('on');
    const max = pairs[0][1];
    $('tallyrows').innerHTML = pairs.map(([k,v]) =>
      '<div class="tal"><span class="lbl">' + esc(k) + '</span>' +
      '<span class="track"><span class="fill" style="width:' + Math.round(v/max*100) + '%"></span></span>' +
      '<span class="ct">' + v + '</span></div>'
    ).join('');
  } else {
    $('tally').classList.remove('on');
  }

  $('list').innerHTML = list.length
    ? list.slice().reverse().map(r =>
        '<div class="row"><div class="nm">' + esc(r.first) + ' ' + esc(r.last) + '</div>' +
        '<div class="bz">' + esc(r.business) + '</div>' +
        '<div class="pn">' + esc(r.pain) + '</div></div>'
      ).join('')
    : '<div class="empty">Board is empty</div>';

  prevCount = list.length;
}

$('refresh').onclick = () => load(false);

$('clear').onclick = async () => {
  if (!confirm('Clear every card off the board? This cannot be undone.')) return;
  $('clear').disabled = true;
  await load(true);
  setTimeout(()=>{ $('clear').disabled = false; }, 1200);
};

load(false);
setInterval(()=>load(false), POLL_MS);
</script>
</body>
</html>
